<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100" fill="none">
    <defs>
        <linearGradient id="mpesaGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00A651" />
            <stop offset="100%" stop-color="#00853D" />
        </linearGradient>
        <linearGradient id="mpesaRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#E31837" />
            <stop offset="100%" stop-color="#C0122B" />
        </linearGradient>
        <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12" />
        </filter>
    </defs>
    
    <!-- Outer Card Container -->
    <rect x="2" y="2" width="316" height="96" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#subtleShadow)" />
    
    <!-- Iconic Safaricom M-Pesa Badge Emblem -->
    <g transform="translate(18, 16)">
        <!-- Green Rounded Box -->
        <rect x="0" y="0" width="68" height="68" rx="14" fill="url(#mpesaGreenGrad)" />
        <!-- Red Inner Arrow/Accent Arc -->
        <path d="M 12 50 C 12 24, 28 14, 52 14" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.9" />
        <!-- Inner phone/coin icon -->
        <circle cx="48" cy="46" r="12" fill="url(#mpesaRedGrad)" />
        <path d="M 44 46 L 47 49 L 53 43" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        <!-- Radiating signal curves -->
        <path d="M 22 42 A 16 16 0 0 1 38 26" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8" />
    </g>
    
    <!-- Powered By Text -->
    <text x="100" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5" fill="#64748B">
        POWERED BY
    </text>
    
    <!-- Official M-PESA Lettering -->
    <!-- 'M' in vibrant Safaricom Red -->
    <text x="100" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', Arial, sans-serif" font-size="32" font-weight="900" fill="#E31837" letter-spacing="0.5">
        M<tspan fill="#00A651">-PESA</tspan>
    </text>
    
    <!-- Verified Kenyan Instant Mobile Money Tag -->
    <g transform="translate(236, 38)">
        <rect x="0" y="0" width="66" height="22" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1" />
        <circle cx="10" cy="11" r="3.5" fill="#00A651" />
        <text x="18" y="14.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" fill="#15803D" letter-spacing="0.5">
            VERIFIED
        </text>
    </g>
    
    <!-- Subtle Live Integration Dot & Subtitle -->
    <text x="100" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#94A3B8">
        Daraja 2.0 • Instant STK Push & C2B
    </text>
</svg>
